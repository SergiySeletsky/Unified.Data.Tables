name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      # The Azurite integration tests must run, not skip: Windows runners cannot run the Linux
      # emulator container, so the same pinned Azurite release is installed from npm (Node is
      # preinstalled) and an unreachable emulator is made a test failure.
      - name: Start Azurite
        shell: powershell
        run: |
          npm install -g azurite@3.35.0
          $data = Join-Path $env:RUNNER_TEMP 'azurite'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $azurite = (Get-Command azurite.cmd).Source
          Start-Process -FilePath $azurite -WindowStyle Hidden -ArgumentList @(
            '--blobHost', '127.0.0.1', '--tableHost', '127.0.0.1', '--loose', '--skipApiVersionCheck', '--location', $data)
          foreach ($port in 10000, 10002) {
            $deadline = (Get-Date).AddSeconds(60)
            while ($true) {
              $client = New-Object System.Net.Sockets.TcpClient
              try { $client.Connect('127.0.0.1', $port); break } catch { } finally { $client.Dispose() }
              if ((Get-Date) -gt $deadline) { throw "Azurite did not open port $port" }
              Start-Sleep -Seconds 1
            }
          }
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          UNIFIED_TABLES_REQUIRE_AZURITE: "1"
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"testasm_unified-data-tables" /o:"testasm" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          dotnet build
          dotnet test --no-build --collect:"XPlat Code Coverage" --settings coverage.runsettings
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
