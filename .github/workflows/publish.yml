name: Publish

# Publishing is triggered by creating a GitHub Release (tag like v0.1.0), or run manually.
# Uses NuGet.org Trusted Publishing (OIDC) — no long-lived API key required.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3). Leave empty to use the .csproj version."
        required: false
        type: string

permissions:
  contents: read
  id-token: write   # required for NuGet Trusted Publishing (OIDC token exchange)

jobs:
  publish:
    name: Build & publish to NuGet.org
    runs-on: ubuntu-latest
    environment: production   # must match the 'Environment' in the nuget.org trusted-publishing policy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"   # strip a leading 'v' (v1.2.3 -> 1.2.3)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION:-<.csproj default>}"

      # The Azurite integration tests must run, not skip, before anything is published: start the
      # emulator (pinned, same flags as local development) and make an unreachable one a test failure.
      - name: Start Azurite
        shell: bash
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
          for port in 10000 10002; do
            for attempt in $(seq 1 60); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then break; fi
              if [ "$attempt" = 60 ]; then echo "Azurite did not open port $port"; docker logs azurite; exit 1; fi
              sleep 1
            done
          done

      - name: Test
        env:
          UNIFIED_TABLES_REQUIRE_AZURITE: "1"
        run: dotnet test Unified.Data.Tables.slnx -c Release

      - name: Pack
        shell: bash
        run: |
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            dotnet pack Unified.Data.Tables.slnx -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}
          else
            dotnet pack Unified.Data.Tables.slnx -c Release -o artifacts
          fi

      # Unified.Data.Tables binds to the abstractions' internals and Unified.Data.Tables.InMemory to the
      # main package's provider SPI, so each must depend on EXACTLY the version packed beside it:
      # [1.2.3], not NuGet's default >= 1.2.3. The pins come from a target in Directory.Build.targets
      # that hooks a private NuGet target; if an SDK update renames that target they vanish without a
      # warning. Read them back from the packages about to be pushed and stop the publish without them.
      - name: Verify exact sibling-package versions
        shell: bash
        run: |
          nuspec() {  # nuspec <package id>: prints the nuspec of the one packed <package id>.<version>.nupkg
            local id="$1" packages
            packages=(artifacts/"$id".[0-9]*.nupkg)
            [ -f "${packages[0]}" ] || packages=()  # a pattern that matches nothing stays as written
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one packed $id in artifacts/, found: ${packages[*]:-none}" >&2
              return 1
            fi
            unzip -p "${packages[0]}" "$id.nuspec"
          }
          require_exact() {  # require_exact <package id> <dependency id>
            local package="$1" dependency="$2" spec sibling version pins
            spec="$(nuspec "$package")" || exit 1
            sibling="$(nuspec "$dependency")" || exit 1
            # The version the dependency was packed as, without build metadata (a range never has it).
            version="$(sed -n 's:.*<version>\([^<+]*\).*:\1:p' <<<"$sibling" | sort -u | paste -sd ' ' -)"
            # The version attribute of every <dependency id="$dependency"> element, whatever the layout.
            pins="$(tr '>' '\n' <<<"$spec" | grep -F '<dependency ' | grep -F " id=\"$dependency\"" \
              | sed -n 's:.* version="\([^"]*\)".*:\1:p' | LC_ALL=C sort -u | paste -sd ' ' - || true)"
            if [ -z "$version" ] || [ "$pins" != "[$version]" ]; then
              echo "::error::$package must depend on $dependency [${version:-version not found}] (exactly the version packed beside it), but its nuspec says: ${pins:-no such dependency}"
              exit 1
            fi
            echo "$package depends on $dependency [$version]"
          }
          require_exact Unified.Data.Tables Unified.Data.Tables.Abstractions
          require_exact Unified.Data.Tables.InMemory Unified.Data.Tables

      - name: NuGet login (OIDC trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          # Your nuget.org username (profile name, NOT email). Stored as a repo secret.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
